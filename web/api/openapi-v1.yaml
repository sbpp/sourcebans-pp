openapi: 3.0.3
info:
  title: SourceBans++ REST API
  version: 1.0.0
  description: >
    Versioned HTTP API for external clients (bots, website-next, scripts).
    Authenticate with a Personal Access Token. The panel JavaScript continues
    to use POST /api.php (cookie JWT + CSRF) and is not a client of this API.
servers:
  - url: /api/v1
    description: Pretty URL (Apache rewrite)
  - url: /api/v1.php
    description: PATH_INFO fallback
security:
  - bearerAuth: []
tags:
  - name: me
  - name: admins
  - name: groups
  - name: bans
  - name: comms
  - name: system
  - name: meta
paths:
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: OpenAPI 3 document for this API
      responses:
        "200":
          description: YAML spec
          content:
            application/yaml:
              schema:
                type: string
  /me:
    get:
      tags: [me]
      summary: The admin bound to this token
      responses:
        "200":
          description: Admin resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admins:
    get:
      tags: [admins]
      summary: List admins
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Paginated admin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admins/{id}:
    parameters:
      - $ref: "#/components/parameters/adminId"
    get:
      tags: [admins]
      summary: Get one admin by aid or Steam64
      responses:
        "200":
          description: Admin resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admins]
      summary: Create or replace an admin
      description: >
        `{id}` as Steam64 upserts (201 create, 200 update, reactivates if
        enabled=0). `{id}` as aid replaces an existing row (404 if missing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
    patch:
      tags: [admins]
      summary: Merge-update an existing admin (never creates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admins]
      summary: Hard-delete an admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /admins/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/adminId"
    post:
      tags: [admins]
      summary: Soft-retire an admin (enabled=0)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /admins/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/adminId"
    post:
      tags: [admins]
      summary: Restore a soft-retired admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /groups:
    get:
      tags: [groups]
      summary: List web groups and SourceMod server groups
      responses:
        "200":
          description: Group catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /system/rehash:
    post:
      tags: [system]
      summary: Run sm_rehash on game servers
      description: >
        If `sids` is omitted or empty, every enabled server is targeted.
        Admin create/update/deactivate/reactivate already rehashes automatically.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Rehash result
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /bans:
    get:
      tags: [bans]
      security: []
      summary: List bans
      description: >
        Public. Anonymous callers follow `banlist.hideplayerips` and
        `banlist.hideadminname`. A valid PAT of a web admin sees IPs and
        admin names. A well-formed but invalid PAT is 401.
        `length` is seconds. Filter with `state`, `search`, `server`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/banState"
        - $ref: "#/components/parameters/serverId"
      responses:
        "200":
          description: Paginated ban list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [bans]
      summary: Create a ban
      description: >
        `length` is minutes (0 = permanent), same as the panel form.
        Optional `kick: true` fans RCON kicks to enabled servers
        (`meta.kick`). The plugin still blocks on next connect without it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanWrite"
      responses:
        "201":
          description: Ban created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
  /bans/{bid}:
    parameters:
      - $ref: "#/components/parameters/banId"
    get:
      tags: [bans]
      security: []
      summary: Get one ban
      responses:
        "200":
          description: Ban resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bans/{bid}/unban:
    parameters:
      - $ref: "#/components/parameters/banId"
    post:
      tags: [bans]
      summary: Lift an active ban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ureason]
              properties:
                ureason:
                  type: string
      responses:
        "200":
          description: Ban after lift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /comms:
    get:
      tags: [comms]
      security: []
      summary: List mute and gag rows
      description: >
        Public. Same hide-admin-name rule as bans. `kind` on the resource
        is `mute` (type 1) or `gag` (type 2). Silence is two rows.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/commState"
        - $ref: "#/components/parameters/serverId"
        - name: kind
          in: query
          schema:
            type: string
            enum: [mute, gag]
      responses:
        "200":
          description: Paginated comms list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [comms]
      summary: Create a mute, gag, or silence
      description: >
        `length` is minutes. `kind` is `mute`, `gag`, or `silence`
        (or `type` 1 / 2 / 3). Silence returns both rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommWrite"
      responses:
        "201":
          description: Block created
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
  /comms/{cid}:
    parameters:
      - $ref: "#/components/parameters/commId"
    get:
      tags: [comms]
      security: []
      summary: Get one mute or gag row
      responses:
        "200":
          description: Comm resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [comms]
      summary: Hard-delete a mute or gag row
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /comms/{cid}/unblock:
    parameters:
      - $ref: "#/components/parameters/commId"
    post:
      tags: [comms]
      summary: Lift an active mute or gag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ureason]
              properties:
                ureason:
                  type: string
      responses:
        "200":
          description: Block after lift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal Access Token (`sbpp_pat_` + 64 hex chars). Minted on Your Account.
  parameters:
    adminId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Numeric aid, or a 17-digit Steam64 that round-trips through Steam2. Steam2/Steam3 is 400.
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    search:
      name: search
      in: query
      schema:
        type: string
      description: Match name, SteamID, reason (and IP when the caller can see IPs).
    banState:
      name: state
      in: query
      schema:
        type: string
        enum: [permanent, active, expired, unbanned]
    commState:
      name: state
      in: query
      schema:
        type: string
        enum: [permanent, active, expired, unmuted]
    serverId:
      name: server
      in: query
      schema:
        type: integer
        minimum: 1
    banId:
      name: bid
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    commId:
      name: cid
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
    Admin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        steam:
          type: string
          nullable: true
        steam64:
          type: string
          nullable: true
          description: Decimal string. Never a JSON number.
        email:
          type: string
        enabled:
          type: boolean
        immunity:
          type: integer
        web_group_id:
          type: integer
          nullable: true
        web_group_name:
          type: string
          nullable: true
        server_group_id:
          type: integer
          nullable: true
        server_group_name:
          type: string
          nullable: true
        server_ids:
          type: array
          items:
            type: integer
        lastvisit:
          type: integer
          nullable: true
    AdminWrite:
      type: object
      properties:
        name:
          type: string
        steam:
          type: string
        email:
          type: string
        web_group_id:
          type: integer
          nullable: true
        server_group_id:
          type: integer
          nullable: true
        server_ids:
          type: array
          items:
            type: integer
        immunity:
          type: integer
        password:
          type: string
          description: Optional. Generated when omitted on create.
    AdminEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Admin"
        meta:
          type: object
          properties:
            rehash:
              type: object
    AdminListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Admin"
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    GroupsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            web:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  flags:
                    type: integer
            server:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  flags:
                    type: string
                  immunity:
                    type: integer
    Ban:
      type: object
      properties:
        id:
          type: integer
        player_name:
          type: string
        type:
          type: string
          enum: [steam, ip]
        steam:
          type: string
          nullable: true
        steam64:
          type: string
          nullable: true
          description: Decimal string. Never a JSON number.
        ip:
          type: string
          nullable: true
        reason:
          type: string
        created:
          type: integer
        ends:
          type: integer
        length:
          type: integer
          description: Seconds stored on the row.
        state:
          type: string
          enum: [permanent, active, expired, unbanned]
        admin_name:
          type: string
          nullable: true
        server_id:
          type: integer
          nullable: true
        unban_reason:
          type: string
          nullable: true
        removed_at:
          type: integer
          nullable: true
    BanWrite:
      type: object
      properties:
        steam:
          type: string
        type:
          description: 0 / steam or 1 / ip
          oneOf:
            - type: integer
              enum: [0, 1]
            - type: string
              enum: [steam, ip]
        ip:
          type: string
        name:
          type: string
        reason:
          type: string
        length:
          type: integer
          minimum: 0
          description: Minutes. 0 is permanent.
        kick:
          type: boolean
          description: Fan RCON kicks to enabled servers after insert.
    BanEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Ban"
        meta:
          type: object
          properties:
            kick:
              type: object
    BanListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ban"
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    Comm:
      type: object
      properties:
        id:
          type: integer
        player_name:
          type: string
        kind:
          type: string
          enum: [mute, gag, unknown]
        steam:
          type: string
          nullable: true
        steam64:
          type: string
          nullable: true
        reason:
          type: string
        created:
          type: integer
        ends:
          type: integer
        length:
          type: integer
          description: Seconds stored on the row.
        state:
          type: string
          enum: [permanent, active, expired, unmuted]
        admin_name:
          type: string
          nullable: true
        server_id:
          type: integer
          nullable: true
        unblock_reason:
          type: string
          nullable: true
        removed_at:
          type: integer
          nullable: true
    CommWrite:
      type: object
      required: [steam]
      properties:
        steam:
          type: string
        kind:
          type: string
          enum: [mute, gag, silence]
        type:
          type: integer
          enum: [1, 2, 3]
          description: 1 mute, 2 gag, 3 silence. Prefer kind.
        name:
          type: string
        reason:
          type: string
        length:
          type: integer
          minimum: 0
          description: Minutes. 0 is permanent.
    CommEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Comm"
    CommListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Comm"
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid PAT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token admin lacks the required flag
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
