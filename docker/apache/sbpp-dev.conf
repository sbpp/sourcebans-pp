# SourceBans++ local-development Apache rules.
#
# Loaded as /etc/apache2/conf-available/zz-sbpp-dev.conf via a2enconf
# in docker/Dockerfile. NOT the production hardening; that lives in
# sbpp-prod.conf. Only rules the panel's behaviour depends on are
# mirrored here, so the dev + E2E stack matches the prod image.

# `demos/` is only reachable through getdemo.php. Same rule (and
# rationale) as the matching block in sbpp-prod.conf.
<DirectoryMatch "^${APACHE_DOCUMENT_ROOT}/demos(/|$)">
    Require all denied
</DirectoryMatch>

Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"
