# Pretty URLs for the REST API in the local dev image.
# Loaded as /etc/apache2/conf-available/sbpp-dev-rewrite.conf via a2enconf.
# PATH_INFO fallback `/api/v1.php/me` works without this file.

<Directory "${APACHE_DOCUMENT_ROOT}">
    RewriteEngine On
    CGIPassAuth On
    RewriteRule ^ - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteRule ^api/v1$ api/v1.php [QSA,L]
    RewriteRule ^api/v1/(.*)$ api/v1.php/$1 [QSA,L]
</Directory>
