# docs-deploy-trigger — fire a repository_dispatch into sbpp.github.io
# whenever main moves under docs/, kicking the Pages deploy in the
# sibling repo.
#
# Cadence: only on push to main with a docs/** path filter. PRs use
# docs-build.yml to validate; this workflow is the production trigger.
#
# Required repo configuration BEFORE this workflow does anything (one-time
# cutover step):
#
#   - Create a fine-grained PAT scoped to `sbpp/sbpp.github.io` only,
#     with the `Actions: Read and write` repository permission. (Classic
#     PATs work too, but the fine-grained variant is strictly narrower
#     and the right default.) Max expiry is one year — set a calendar
#     reminder to rotate.
#   - Repo SECRET   `DOCS_DEPLOY_PAT`     = the token value.
#   - Repo VARIABLE `DOCS_DEPLOY_ENABLED` = any non-empty value (e.g.
#     `true`). This is the feature-flag the job-level `if:` guard
#     below checks. We can't reference `secrets.*` directly in a
#     job-level `if:` (GitHub Actions context-availability rule), so
#     the operator opts in by setting the paired VARIABLE explicitly.
#
# Until `vars.DOCS_DEPLOY_ENABLED` is set, the `trigger` job below is
# skipped via the job-level `if:` guard — every push to `docs/**` shows
# up as a "Skipped" run in the Actions tab (grey icon) instead of a
# red-failing run. This stops the original anti-pattern (#1339-followup):
# the dispatch action errors out on missing credentials, the workflow
# goes red, and an operator who hasn't done the cutover yet sees a
# stream of confusing failures. The deploy shell in sbpp.github.io also
# has a `workflow_dispatch` trigger as a manual fallback while the PAT
# is pending.

name: docs-deploy-trigger

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy-trigger.yml'

# Allow at most one in-flight trigger at a time; if a second push lands
# while the first is still running, queue the second and skip any
# intermediate runs. The dispatched workflow in sbpp.github.io is
# itself idempotent (it always builds from sourcebans-pp@main), so
# coalescing here is safe.
concurrency:
  group: docs-deploy-trigger
  cancel-in-progress: false

jobs:
  trigger:
    name: Dispatch docs-changed event
    runs-on: ubuntu-24.04
    permissions: {}
    # Skip the job entirely when the PAT isn't configured yet. Unset
    # repo variables resolve to empty string in expressions, so this is
    # the canonical "feature-flag a job" shape. Once
    # `vars.DOCS_DEPLOY_ENABLED` is set, the guard becomes transparent
    # and the job runs every push.
    #
    # Why a paired VARIABLE rather than checking the SECRET directly:
    # GitHub Actions doesn't expose the `secrets` context in job-level
    # `if:` conditions (only `github`, `inputs`, `needs`, `vars` are
    # available there). Step-level `if:` does see `secrets`, but
    # putting the guard at the step level means the job still spins up
    # a runner just to skip every step inside it — wasteful and noisy.
    # The variable IS the operator's "I've done the cutover" signal.
    if: vars.DOCS_DEPLOY_ENABLED != ''

    steps:
      # The dispatched workflow in sbpp.github.io listens for
      # `event_type: docs-changed`. The client_payload carries the
      # commit SHA and ref so the deploy job can pin its sourcebans-pp
      # checkout to the exact commit that fired the dispatch (race
      # guard for back-to-back pushes).
      - name: Dispatch repository_dispatch into sbpp.github.io
        env:
          GH_TOKEN: ${{ secrets.DOCS_DEPLOY_PAT }}
        run: |
          gh api repos/sbpp/sbpp.github.io/dispatches \
            --method POST \
            --field event_type=docs-changed \
            --field 'client_payload[source_repo]=${{ github.repository }}' \
            --field 'client_payload[source_sha]=${{ github.sha }}' \
            --field 'client_payload[source_ref]=${{ github.ref }}'
