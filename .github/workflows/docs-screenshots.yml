# docs-screenshots — auto-capture installer + panel screenshots and
# commit them back to the PR branch.
#
# Cadence: gated on the `affects-ui` label + workflow_dispatch. NO
# scheduled cadence — UI changes ship with their docs in the same PR
# (see #1333 §7), so a weekly job would burn CI on no-ops and risk
# drift between the screenshot and the UI it depicts.
#
# Required repo configuration BEFORE this workflow can succeed:
#
#   - Create the `affects-ui` label in repo settings (Workstream 9).
#     The trigger condition silently no-ops on PRs without the label,
#     so a missing label makes the workflow look broken even though
#     it's healthy. Create the label, apply it to the PR, push.
#
# The workflow needs to write back to the PR branch. We use the
# default GITHUB_TOKEN with explicit `contents: write` and request
# the PR's head branch via `pull_request_target` so the auto-commit
# lands on the contributor's fork (the action handles the auth).

name: docs-screenshots

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Serialize per-PR so two pushes in quick succession don't race on the
# same set of PNGs.
concurrency:
  group: docs-screenshots-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture installer + panel screenshots
    # Only run when the PR carries `affects-ui`. workflow_dispatch
    # invocations bypass the gate (manual reruns are explicit).
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'affects-ui')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read

    steps:
      # pull_request_target checks out main by default; flip to the PR
      # head so we capture against the actual change AND can push the
      # auto-commit to the right branch. Pinned via the SHA so a
      # malicious PR can't swap the ref under us.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      # Boot the same dev stack a developer gets locally via
      # `./sbpp.sh up`. CI owns the runner so the default ports
      # (8080 / 8081 / 8025 / 1025 / 3307) don't collide.
      - name: Bring up the dev stack
        run: docker compose up -d --wait

      - name: Wait for the panel
        run: |
          for i in {1..30}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/index.php?p=login || true)
            if [[ "$code" == "200" ]]; then
              echo "panel ready after attempt $i"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying"
            sleep 3
          done
          echo "panel never came up" >&2
          docker compose logs --tail=200 web db
          exit 1

      - name: Install docs deps + Playwright browser
        working-directory: docs
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: docs
        env:
          # Hardcoded all-zero key the capture script bakes into the
          # install wizard. Real installs use a real Steam API key;
          # the dev seed never round-trips back to Steam, so the
          # zero key is fine for screenshot work (#1333 §7).
          STEAM_API_KEY: '00000000000000000000000000000000'
          PANEL_URL: 'http://localhost:8080'
        run: npm run capture

      - name: Tear down stack
        if: always()
        run: docker compose down -v

      # If `npm run capture` produced any deltas under
      # docs/src/assets/auto/, commit them back to the PR branch so
      # the screenshot diff lands in the same PR as the UI change.
      # The action no-ops when nothing changed.
      - name: Commit captured screenshots back to PR branch
        if: github.event_name != 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            docs: refresh auto-captured screenshots (#1333)

            Generated by .github/workflows/docs-screenshots.yml on
            push to a PR labelled `affects-ui`.
          file_pattern: 'docs/src/assets/auto/**'
          commit_user_name: 'sbpp-docs-bot'
          commit_user_email: 'sbpp-docs-bot@users.noreply.github.com'
